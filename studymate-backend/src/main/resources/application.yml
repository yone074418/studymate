spring:
  application:
    name: studymate-backend
  profiles:
    active: dev

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

studymate:
  jwt:
    secret: studymate-day3-dev-secret-change-before-production
    expiration-seconds: 86400
  ai:
    mock-enabled: true
    api-url: ${STUDYMATE_AI_API_URL:https://api.deepseek.com/anthropic}
    api-key: ${STUDYMATE_AI_API_KEY:sk-9e87aee4c7b54314ba13d267898c3463}
    model: ${STUDYMATE_AI_MODEL:deepseek-v4-flash}
    timeout-ms: ${STUDYMATE_AI_TIMEOUT_MS:10000}
